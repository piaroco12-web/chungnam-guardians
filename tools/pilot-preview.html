<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파일럿 탑승과 가호 디자인</title><style>@font-face{font-family:GameKR;src:url(../assets/fonts/NotoSansKR.woff2);font-weight:100 900}body{margin:0;padding:24px;background:#0d1931;color:white;font:700 18px GameKR,system-ui}h1,h2,p{text-align:center}h1{font-size:28px}p{font-size:14px;color:#c9e8ff}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:1080px;margin:auto}article{display:grid;justify-items:center;padding:14px;background:radial-gradient(#2e5670,#172d4c);border:2px solid #76d7f2;border-radius:18px}article h2{font-size:20px;margin:5px}canvas{max-width:100%;height:auto}.small{width:92px;height:92px}.effects{grid-template-columns:repeat(6,minmax(0,1fr))}.effects h2{font-size:14px}@media(max-width:540px){body{padding:12px}main{gap:6px}article{padding:5px}article h2{font-size:12px}.effects{grid-template-columns:repeat(3,minmax(0,1fr))}}</style><h1>파일럿 × 기체 · 9가지 탑승 조합</h1><p>각 칸 위는 확대 모습, 아래는 게임에서 쓰는 92 크기입니다.</p><main id="pilots"></main><h1>전투용 가호 그림</h1><main id="effects" class="effects"></main><script type="module">
import {loadAssets,art} from '../src/assets.js';import {PILOTS,SHIPS} from '../data/content.js';
await loadAssets();for(const p of PILOTS)for(const s of SHIPS){const el=document.createElement('article');const h=document.createElement('h2');h.textContent=p.name+' · '+s.name;el.append(h);for(const size of [256,92]){const c=document.createElement('canvas');c.width=c.height=size;c.dataset.pilot=p.id;c.dataset.ship=s.id;if(size===92)c.className='small';c.getContext('2d').drawImage(art.ship(s.id,p.id),0,0,size,size);el.append(c)}document.getElementById('pilots').append(el)}
const names=['번개 구슬','얼음 칼날','소용돌이','불꽃 깃털','바람개비','빛 구슬','낙뢰','서리꽃','해일','봉황','회오리','등대 불빛'];for(let i=0;i<12;i++){const el=document.createElement('article');const h=document.createElement('h2');h.textContent=names[i];const c=document.createElement('canvas');c.width=c.height=128;c.getContext('2d').drawImage(art.skill(i),0,0,128,128);el.append(h,c);document.getElementById('effects').append(el)}document.body.dataset.ready='true';
</script></html>
