<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>충남 수호대 · 새 기능 그림</title>
<style>
@font-face{font-family:Noto;src:url('../assets/fonts/NotoSansKR.woff2')}@font-face{font-family:Game;src:url('../assets/fonts/BlackHanSans-Regular.woff2')}*{box-sizing:border-box}body{margin:0;background:#101b36;color:#e8f6ff;font-family:Game,Noto,sans-serif}main{max-width:1100px;margin:auto;padding:28px 18px}h1,h2{color:#ffe3a2;font-weight:400}p{color:#d0e1f3;line-height:1.6}.icons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}figure{margin:0;padding:12px;border:2px solid #89cbe4;border-radius:22px;background:linear-gradient(#32537e,#172b48);text-align:center;box-shadow:inset 0 2px #ffffff44,0 5px #071226}.feature-icon{display:block;width:100%;aspect-ratio:1;object-fit:contain}figcaption{padding-top:10px;line-height:1.5}.panels{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:28px}.panel{border:2px solid #92cde9;border-radius:22px;padding:20px;background:linear-gradient(145deg,#2d496b,#162c49);position:relative}.panel h2{margin-top:0}.shop{display:flex;gap:12px;align-items:center;padding:12px;background:#152842dd;border:2px solid #a9ebec;border-radius:16px}.shop .feature-icon{width:90px;flex:none}.shop span{line-height:1.5}.shop small{display:block;color:#cdddef;font-family:Noto,sans-serif}.gold{color:#fff2a0}.locked .feature-icon{filter:grayscale(1);opacity:.65}.locked{margin-top:12px}.host{display:block;width:75%;height:230px;object-fit:contain;margin:auto}.question{padding:16px;background:#11213c;border:2px solid #74cce0;border-radius:14px;text-align:center;font-size:20px;line-height:1.6}.answers{display:flex;gap:14px;margin-top:16px}.answers button{flex:1;font-size:30px}.yes{background:linear-gradient(#53db9b,#169365)}.no{background:linear-gradient(#ff7795,#d14365)}button{border:2px solid #a9ddee;color:#fff;border-radius:12px;padding:11px 16px;font-family:inherit;font-size:16px;cursor:pointer;box-shadow:0 4px #071226;background:linear-gradient(#4778a3,#2b506f)}button:disabled{opacity:.65;cursor:default}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}.battle{background:#10243f url('../assets/img/bg_asan.webp') center/cover;position:relative;overflow:hidden;border-radius:16px}.battle canvas{width:100%;display:block}.save{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;margin-top:15px;color:#fff4cf;background:#102c3b;border:2px solid #9ce7d3;border-radius:14px}.save .feature-icon{width:48px;height:48px}.status{min-height:26px;text-align:center;color:#bcf4dd}a{color:#a8f0e2}@media(max-width:680px){main{padding:18px 12px}.icons{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.panels{grid-template-columns:1fr}.panel{padding:16px}h1{font-size:27px}.host{height:210px}}
</style>
<main><h1>새 기능 · 입체 아트 적용안</h1><p>정화 대폭발 · OX 퀴즈 러시 · 자동 저장. 게임에서 사용하는 이미지 로더와 효과 그리기로 구성한 미리보기입니다. 여기서는 코인·기록이 바뀌지 않습니다.</p><div class="icons" id="icons"></div><div class="panels">
<section class="panel"><h2>정화 대폭발</h2><div class="shop"><div id="shopIcon"></div><span>정화 대폭발<small>빛과 하트로 퍼지는 정화 구슬</small><b class="gold">300코인 · 보관 한도 1개</b></span></div><div class="shop locked"><div id="lockIcon"></div><span>오늘의 도전<small>오늘의 도전에서는 쓸 수 없어요</small></span></div><div class="controls"><button id="burst">정화 효과 재생</button><button id="calm" aria-pressed="false">섬광 줄이기: 꺼짐</button></div><div class="battle"><canvas id="burstCanvas" width="540" height="400"></canvas></div><div class="save" id="save"><span id="saveIcon"></span><span>진행 기록 저장</span></div></section>
<section class="panel"><h2>OX 퀴즈 러시</h2><img class="host" id="host" alt="O·X 팻말을 든 센터이"><div class="question">AI가 알려 준 정보도<br>다른 자료와 비교해 확인해요.</div><div class="answers"><button class="yes" id="yes" aria-label="O 선택">O</button><button class="no" id="no" aria-label="X 선택">X</button></div><p class="status" id="answer" role="status">팻말을 눌러 선택 모션을 확인하세요.</p><div class="save"><span id="rushIcon"></span><span>60초 · 정답마다 10코인</span></div></section></div><p><a href="../">게임으로 돌아가기</a></p></main>
<script type="module">
import{loadAssets,pic,art}from'../src/assets.js';import{featureIcon}from'../src/ui.js';import{drawPurgeBurst}from'../src/combat-vfx.js';
await loadAssets();await document.fonts.ready;
for(const[id,label]of[['purge','정화 구슬'],['purge_locked','잠금 구슬'],['quiz_rush','퀴즈 러시'],['autosave','자동 저장']]){const f=document.createElement('figure');f.innerHTML=featureIcon(id)+`<figcaption>${label}</figcaption>`;document.getElementById('icons').append(f)}
for(const[el,id]of[['shopIcon','purge'],['lockIcon','purge_locked'],['saveIcon','autosave'],['rushIcon','quiz_rush']])document.getElementById(el).innerHTML=featureIcon(id);
document.getElementById('host').src=pic.quizHost();
const canvas=document.getElementById('burstCanvas'),g=canvas.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion: reduce)');let quiet=reduced.matches,start=null,raf=0;
function paint(t=1){g.clearRect(0,0,540,400);const im=art.feature('purge');if(im)g.drawImage(im,220,150,100,100);drawPurgeBurst(g,270,200,t,quiet)}
function frame(ms){if(start===null)start=ms;const t=(ms-start)/1000;paint(t);if(t<1)raf=requestAnimationFrame(frame);else{document.getElementById('burst').disabled=false;start=null}}
document.getElementById('burst').onclick=()=>{cancelAnimationFrame(raf);start=null;document.getElementById('burst').disabled=true;raf=requestAnimationFrame(frame)};
document.getElementById('calm').onclick=e=>{quiet=!quiet;e.target.textContent='섬광 줄이기: '+(quiet?'켜짐':'꺼짐');e.target.setAttribute('aria-pressed',String(quiet))};
for(const id of ['yes','no'])document.getElementById(id).onclick=e=>{document.getElementById('answer').textContent=id==='yes'?'정답! 자료를 비교하면 더 정확히 알 수 있어요.':'다른 자료와 비교해 확인하는 습관이 필요해요.';if(!quiet&&!reduced.matches)e.target.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:260})};
paint();document.body.dataset.ready='true';
</script></html>
