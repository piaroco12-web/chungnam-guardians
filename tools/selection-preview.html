<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>선택 화면 디자인·모션 미리보기</title><link rel="stylesheet" href="../style.css"><style>.preview-controls{position:fixed;top:12px;right:12px;z-index:50;display:flex;flex-direction:column;gap:7px;max-width:170px}.preview-controls button{font:700 13px var(--body);padding:8px;color:white;background:#244469;border:1px solid #a2e4ff;border-radius:8px;cursor:pointer}.preview-controls p{font-size:12px;color:#d3f7ff}@media(max-width:800px){.preview-controls{top:auto;bottom:0;left:0;right:0;flex-direction:row;overflow-x:auto;max-width:none;background:#0b1835e8;padding:5px}.preview-controls p{display:none}.preview-controls button{flex:none;font-size:11px;padding:6px}}</style><div id="stage"><canvas id="game"></canvas><div id="ui"></div></div><nav class="preview-controls" aria-label="디자인 미리보기"><p>선택 화면 미리보기<br>선택하면 모션·소리가 나요.</p><button data-scene="upgrade">업그레이드</button><button data-scene="path">코인·쉼터 갈림길</button><button data-scene="path2">가호·정예 갈림길</button><button data-scene="zodiac">12지신 동료</button><button data-scene="altar">수호신 제단</button><button data-scene="reward">카드 획득</button><button data-scene="gamble">도전 강화</button><button data-scene="mystery">흔들리는 제단</button></nav><script type="module">
import * as ui from '../src/ui.js';import {loadAssets,pic} from '../src/assets.js';import {fitStage} from '../src/view.js';import {newRun} from '../src/battle.js';import {WEAPONS,UPGRADES} from '../data/build.js';import {GODS,BOONS,DUOS,LEGENDS} from '../data/boons.js';import {PATHS} from '../data/extras.js';import {ZODIAC} from '../data/zodiac.js';import {CARDS} from '../data/content.js';import {unlockAudio} from '../src/audio.js';
const stage=document.getElementById('stage'),canvas=document.getElementById('game');const fit=()=>fitStage(stage,canvas);fit();window.addEventListener('resize',fit);await loadAssets();ui.initUi();stage.style.background=`url(${pic.base()}) center/cover`;const run=newRun({pilot:'chungnami',ship:'byeolbit',diff:'sprout'});const picked=()=>ui.toast('선택을 확인했어요. 오른쪽 메뉴에서 다시 볼 수 있어요.');const scenes={gamble:()=>ui.levelUp(run,[{type:'weapon',def:WEAPONS.find(x=>x.id==='missile'),lv:1,gamble:true,chance:.72},{type:'coin'},{type:'heal'}],'byeolbit',picked),mystery:()=>ui.altar(run,[{type:'boon',def:BOONS[0],god:GODS[0],rarity:1,mystery:true},{type:'duo',def:DUOS[0],god:GODS[1]},{type:'legend',def:LEGENDS[3],god:GODS[3]}],picked,()=>{}),upgrade:()=>ui.levelUp(run,[{type:'weapon',def:WEAPONS.find(x=>x.id==='missile'),lv:1},{type:'upgrade',def:UPGRADES.find(x=>x.id==='cd'),lv:1},{type:'weapon',def:WEAPONS.find(x=>x.id==='boomerang'),lv:0}],'byeolbit',picked),path:()=>ui.pathPick([PATHS[0],PATHS[1]],picked),path2:()=>ui.pathPick([PATHS[3],PATHS[4]],picked),zodiac:()=>ui.zodiacPick([ZODIAC[0],ZODIAC[2],ZODIAC[4]],picked),altar:()=>ui.altar(run,[{type:'boon',def:BOONS[0],god:GODS[0],rarity:1},{type:'duo',def:DUOS[0],god:GODS[1]},{type:'legend',def:LEGENDS[3],god:GODS[3]}],picked,()=>{}),reward:()=>ui.cardReveal(CARDS[0],picked)};document.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>{unlockAudio();scenes[b.dataset.scene]()}));scenes.path();document.body.dataset.ready='true';
</script></html>
