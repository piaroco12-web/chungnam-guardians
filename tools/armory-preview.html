<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>충남 수호대 · 무기와 지역 몬스터</title><style>
@font-face{font-family:Game;src:url('../assets/fonts/BlackHanSans-Regular.woff2')}*{box-sizing:border-box}body{margin:0;background:#101a35;color:#eefaff;font-family:Game,system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px 16px 50px}h1,h2{font-family:Game;font-weight:400;color:#ffe6a1}h1{font-size:28px}p{line-height:1.6;color:#c2dcef}section{margin:30px 0}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}figure{margin:0;padding:10px 5px;background:linear-gradient(145deg,#2b4970,#182a48);border:2px solid #82bedb;border-radius:18px;box-shadow:inset 0 2px #ffffff35,0 5px #080f27;text-align:center}figure img,figure canvas{width:100%;aspect-ratio:1;object-fit:contain}figcaption{font-weight:800;font-size:14px;line-height:1.4;min-height:36px}.monsters{grid-template-columns:repeat(6,minmax(0,1fr))}.sub{grid-template-columns:repeat(4,minmax(0,1fr))}.combat{display:block;width:100%;height:auto;background:#152340;border:2px solid #6a9fc7;border-radius:18px}button{padding:9px 16px;border:2px solid #d5f5ff;border-radius:10px;background:#385f83;color:white;font-weight:800;cursor:pointer}a{color:#9ee9ed}@media(max-width:600px){main{padding:16px 10px}.grid{gap:6px}figure{padding:5px 2px;border-radius:10px}figcaption{font-size:11px;min-height:30px}.monsters{grid-template-columns:repeat(3,minmax(0,1fr))}h1{font-size:24px}}
</style><main><h1>무기 진화 & 지역 몬스터</h1><p>실제 게임에서 사용하는 그림과 전투 그리기 함수입니다. 기본 → 진화 A → 진화 B → 궁극의 차이를 확인해 보세요.</p><section><h2>새 지역 몬스터 6종</h2><div id="monsters" class="grid monsters"></div></section><section><h2>메인 무기 5종</h2><div id="main" class="grid"></div></section><section><h2>진화 A · 진화 B · 궁극</h2><div id="evo" class="grid"></div></section><section><h2>지뢰·포탑과 조합 진화</h2><div id="sub" class="grid sub"></div></section><section><h2>전투 중 탄·파동 변화</h2><p>기관포의 별빛·정밀탄, 산탄 폭죽, 플라스마·레일·오로라, 민트 유도 미사일과 수호·해일 파동.</p><button id="pause">일시정지 / 재생</button><canvas id="combat" class="combat" width="1080" height="860"></canvas></section><p><a href="../">게임으로 돌아가기</a></p></main><script type="module">
import {loadAssets,pic,art} from '../src/assets.js';import {MAIN_WEAPONS} from '../data/weapons.js';import {drawProjectile,drawPWave,drawMine,drawTurret} from '../src/combat-vfx.js';
await loadAssets();await document.fonts.ready;
const put=(root,im,label)=>{const f=document.createElement('figure');const image=document.createElement('img');image.src=im;image.alt='';const cap=document.createElement('figcaption');cap.textContent=label;f.append(image,cap);document.getElementById(root).append(f)};
for(const w of MAIN_WEAPONS)put('main',pic.mainWeapon(w.id),w.name);
for(const k of ['a','b','u'])for(const w of MAIN_WEAPONS)put('evo',pic.mainEvo(w.id,k),k==='u'?w.ult.name:w.pairs[k==='a'?0:1].evo.name);
for(const [id,name] of [['mine','지뢰 투하'],['turret','보조 레이저 포탑'],['evo_mine','연쇄 지뢰'],['evo_turret','쌍둥이 포탑']])put('sub',pic.skill(id),name);
for(const [id,name]of [['likebee','좋아요 벌'],['copyslime','복붙 슬라임'],['rumormoth','뒷담 나방'],['phishfish','낚시 물고기'],['smogdrone','매연 드론'],['biaseye','편향 눈알']]){const f=document.createElement('figure'),c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(art.enemy(id),0,0,256,256);const cap=document.createElement('figcaption');cap.textContent=name;f.append(c,cap);document.getElementById('monsters').append(f)}
const canvas=document.getElementById('combat'),g=canvas.getContext('2d');let pause=false,clock=0,last=0;document.getElementById('pause').onclick=()=>pause=!pause;
function frame(ms){if(!pause)clock+=(ms-last)/1000;last=ms;g.clearRect(0,0,1080,860);g.font='20px Game, sans-serif';g.textAlign='center';const labels=['기본','진화 A','진화 B','궁극'];labels.forEach((l,i)=>{g.fillStyle='#ffe6ac';g.fillText(l,250+i*220,36)});MAIN_WEAPONS.forEach((w,row)=>{const y=110+row*135;g.fillStyle=w.color;g.fillText(w.name,75,y);['','a','b','u'].forEach((branch,col)=>{const x=250+col*220;g.save();g.beginPath();g.rect(x-94,y-54,188,112);g.clip();if(w.id==='wave')drawPWave(g,{x,y:y+20,w:w.fire.width*(branch==='a'||branch==='u'?1.35:1),bow:w.fire.bow,band:w.fire.band*(branch==='a'||branch==='u'?1.5:1),heal:branch==='b'||branch==='u',evolved:!!branch,visualBranch:branch},clock);else for(let i=0;i<3;i++)drawProjectile(g,{x:x+(i-1)*38,y:y+14-Math.sin(clock*2+i)*8,vx:0,vy:-900,r:6,kind:w.fire.kind,main:true,visualWeapon:w.id,visualBranch:branch,visualLevel:branch?5:1,evolved:!!branch},clock);g.restore()})});g.fillStyle='#e3f5ff';g.fillText('보조 무기',80,790);drawMine(g,{x:250,y:785,r:18,arm:0,evolved:false},clock);drawMine(g,{x:470,y:785,r:18,arm:0,evolved:true},clock);drawTurret(g,690,785,false,clock);drawTurret(g,910,785,true,clock);requestAnimationFrame(frame)}requestAnimationFrame(frame);document.body.dataset.ready='true';
</script></html>
