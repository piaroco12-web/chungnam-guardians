<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>충남 수호대 · 위성과 주변 발사대</title><style>@font-face{font-family:Game;src:url('../assets/fonts/BlackHanSans-Regular.woff2')}*{box-sizing:border-box}body{margin:0;background:#101b36;color:#e8f6ff;font-family:Game,sans-serif}main{max-width:1180px;margin:auto;padding:25px 18px}h1,h2{color:#ffe3a2;font-weight:400}p{color:#c9e3f2;line-height:1.6}.units{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.scenes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}figure{margin:0;background:linear-gradient(#2c4e71,#182d4c);border:2px solid #8dcce6;border-radius:18px;padding:8px;text-align:center;box-shadow:inset 0 2px #ffffff38,0 5px #071226}figure img{width:100%;aspect-ratio:1;object-fit:contain}figcaption{padding:8px 2px;line-height:1.4}canvas{display:block;width:100%;height:auto;border-radius:12px}.scenes figure{padding:5px}button{background:#315575;border:2px solid #99daea;color:#fff;border-radius:10px;padding:10px 18px;font-family:inherit;cursor:pointer;margin:12px 10px 18px 0}a{color:#b5f4e4}@media(max-width:700px){.units{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.scenes{grid-template-columns:1fr;max-width:440px;margin:auto}h1{font-size:25px}main{padding:18px 10px}.units figcaption{font-size:13px}}</style><main><h1>위성 · 주변 발사대 업그레이드</h1><p>게임과 같은 위성·포탑·편대 드론·광선 발사기입니다. 위성의 크기는 보기 좋게 정리하고 공격 반경과 발사 위치는 유지했습니다.</p><div id="units" class="units"></div><h2>파동포 · 대형 · 수호 · 서해 해일</h2><canvas id="waves" width="1080" height="230" style="background:#172b49;border:2px solid #89cbe4;margin-bottom:24px"></canvas><h2>실제 전투 화면</h2><button id="pause">일시정지 / 재생</button><button id="calm">섬광 줄이기: 꺼짐</button><div id="scenes" class="scenes"></div><p><a href="../">게임으로 돌아가기</a></p></main><script type="module">
import{loadAssets,art}from'../src/assets.js';import{Battle,newRun}from'../src/battle.js';import{render}from'../src/render.js';import{save}from'../src/save.js';import{drawPWave}from'../src/combat-vfx.js';import{MW}from'../data/weapons.js';await loadAssets();await document.fonts.ready;
for(const [id,label]of[['satellite','기본 위성'],['evo_satellite','진화 위성'],['turret','레이저 포탑'],['evo_turret','쌍둥이 포탑'],['drone','편대 드론'],['emitter','광선 발사기']]){const f=document.createElement('figure'),c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(art.support(id),0,0,256,256);const cap=document.createElement('figcaption');cap.textContent=label;f.append(c,cap);document.getElementById('units').append(f)}
const scenes=[['기본 위성·보조 포탑','byeolbit',false,null],['진화 위성·드론 편대','drone',true,'drones'],['진화 포탑·광선 발사기','beongae',true,'beam']].map(([label,ship,evo,ult])=>{const f=document.createElement('figure'),c=document.createElement('canvas');c.width=540;c.height=960;const cap=document.createElement('figcaption');cap.textContent=label;f.append(c,cap);document.getElementById('scenes').append(f);const run=newRun({pilot:'centeri',ship,diff:'sprout'});run.weapons.satellite=evo?5:3;run.weapons.turret=5;if(evo)run.evolved=['evo_satellite','evo_turret'];const battle=new Battle(run,{hud(){}});battle.banner=null;battle.p.x=270;battle.p.y=670;battle.ultKind=ult;battle.ultT=ult?3:0;return{c,battle}});
const waveG=document.getElementById('waves').getContext('2d');let paused=false,last=0,time=0;document.getElementById('pause').onclick=()=>paused=!paused;document.getElementById('calm').onclick=e=>{save.settings.calm=!save.settings.calm;e.target.textContent='섬광 줄이기: '+(save.settings.calm?'켜짐':'꺼짐')};function frame(ms){if(last&&!paused)time+=(ms-last)/1000;last=ms;waveG.clearRect(0,0,1080,230);['','a','b','u'].forEach((branch,i)=>{waveG.fillStyle='#fff0be';waveG.font='20px Game';waveG.textAlign='center';waveG.fillText(['기본 파동','대형 파동','수호 파동','서해 해일'][i],135+i*270,35);const big=branch==='a'||branch==='u';drawPWave(waveG,{x:135+i*270,y:140,w:MW.wave.fire.width*(big?1.35:1),bow:MW.wave.fire.bow,band:MW.wave.fire.band*(big?1.5:1),heal:branch==='b'||branch==='u',evolved:!!branch,visualBranch:branch},time)});for(const{c,battle}of scenes){battle.t=time;battle.scroll=time*32;render(c.getContext('2d'),battle,1)}requestAnimationFrame(frame)}requestAnimationFrame(frame);document.body.dataset.ready='true';
</script></html>
