<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>충남 수호대 · 보안 연결 검사</title><style>body{background:#12213d;color:#e9f4ff;font:18px system-ui,sans-serif;margin:0}main{max-width:680px;margin:8vh auto;padding:25px}h1{color:#ffe0a0;font-size:30px}p{line-height:1.7}button{font:inherit;padding:14px 22px;background:#ffd16b;border:0;border-radius:12px;color:#14233c;cursor:pointer}#status{padding:20px;border:1px solid #93d9de;border-radius:16px;margin:20px 0;white-space:pre-wrap}a{color:#91e7d4}</style><main><h1>보안 연결 검사</h1><p>학생 기록을 읽거나 저장하지 않고, 로그인하지 않은 조회 요청이 거절되는지 확인합니다.</p><button id="check">연결 검사 시작</button><div id="status" role="status">검사 버튼을 눌러 주세요.</div><a href="./">게임으로 돌아가기</a></main><script type="module">
import {serverRequest} from './src/server-api.js';
document.getElementById('check').onclick=async()=>{const b=document.getElementById('check'),s=document.getElementById('status');b.disabled=true;s.textContent='보안 서버 연결을 확인하고 있어요…';try{await serverRequest({action:'teacherBoard',date:'2026-10-25',token:'invalid-test'});s.textContent='확인이 필요합니다: 권한 없는 조회가 허용되었습니다.';s.dataset.result='fail';}catch(e){if(e.message==='요청을 처리하지 못했어요. 권한 또는 입력을 확인해 주세요.'){s.textContent='연결 정상\n로그인하지 않은 학생 기록 조회가 차단되었습니다.';s.dataset.result='pass';}else{s.textContent='연결 확인 실패: '+e.message;s.dataset.result='fail';}}finally{b.disabled=false;}};
</script></html>
